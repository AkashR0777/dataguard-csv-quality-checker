
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DataGuard CSV data quality checker

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address that must confirm the SNS subscription

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        INCOMING_PREFIX: incoming/
        REPORTS_PREFIX: reports/
        MAX_FILE_SIZE: 10485760

  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type'"
      AllowMethods: "'GET,POST,OPTIONS'"

Resources:

  # --------------------------------------------------
  # S3 DATA BUCKET
  # --------------------------------------------------

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-dataguard-${AWS::AccountId}-${AWS::Region}'

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - http://localhost:5500
              - http://127.0.0.1:5500
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag

  # --------------------------------------------------
  # SNS NOTIFICATION TOPIC
  # --------------------------------------------------

  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-dataguard-reports'

  NotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      TopicArn: !Ref NotificationTopic
      Endpoint: !Ref NotificationEmail

  # --------------------------------------------------
  # API LAMBDA IAM ROLE
  # --------------------------------------------------

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dataguard-project-api-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: DataGuardApiPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: '*'

              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*:*'

              # S3 permissions use a predictable ARN to avoid
              # circular dependencies with the S3 bucket.

              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AWS::StackName}-dataguard-${AWS::AccountId}-${AWS::Region}'
                Condition:
                  StringLike:
                    s3:prefix:
                      - incoming/job-*
                      - reports/*

              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AWS::StackName}-dataguard-${AWS::AccountId}-${AWS::Region}/incoming/*'

              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${AWS::StackName}-dataguard-${AWS::AccountId}-${AWS::Region}/incoming/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${AWS::StackName}-dataguard-${AWS::AccountId}-${AWS::Region}/reports/*'

  # --------------------------------------------------
  # VALIDATOR LAMBDA IAM ROLE
  # --------------------------------------------------

  ValidatorFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dataguard-project-validator-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: DataGuardValidatorPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: '*'

              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*:*'

              # S3 permissions use predictable ARNs to avoid
              # circular dependencies.

              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AWS::StackName}-dataguard-${AWS::AccountId}-${AWS::Region}/incoming/*'

              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${AWS::StackName}-dataguard-${AWS::AccountId}-${AWS::Region}/reports/*'

              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref NotificationTopic

  # --------------------------------------------------
  # API LAMBDA FUNCTION
  # --------------------------------------------------

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend.api_handler.lambda_handler
      Role: !GetAtt ApiFunctionRole.Arn

      Environment:
        Variables:
          BUCKET_NAME: !Sub '${AWS::StackName}-dataguard-${AWS::AccountId}-${AWS::Region}'

      Events:

        UploadUrl:
          Type: Api
          Properties:
            Path: /upload-url
            Method: post

        JobStatus:
          Type: Api
          Properties:
            Path: /jobs/{job_id}
            Method: get

        JobReport:
          Type: Api
          Properties:
            Path: /jobs/{job_id}/report
            Method: get

  # --------------------------------------------------
  # CSV VALIDATOR LAMBDA FUNCTION
  # --------------------------------------------------

  ValidatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend.validator_handler.lambda_handler
      Role: !GetAtt ValidatorFunctionRole.Arn

      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref NotificationTopic

      Events:
        IncomingCsv:
          Type: S3
          Properties:
            Bucket: !Ref DataBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/
                  - Name: suffix
                    Value: .csv

# --------------------------------------------------
# OUTPUTS
# --------------------------------------------------

Outputs:

  ApiEndpoint:
    Description: API Gateway endpoint to place in frontend/config.js
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'

  DataBucketName:
    Description: Private S3 bucket created by the stack
    Value: !Ref DataBucket
  